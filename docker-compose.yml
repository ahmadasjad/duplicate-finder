services:
  app:
    build: .
    container_name: file_management_app
    ports:
      - "8501:8501"
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - .:/app
      # Mount host directories for scanning duplicates (using accessible paths)
      - ./.local/test_data:/host_test_data:ro  # Read-only access to test data directory
      - ./mounts/gdrive_mount:/mnt/gdrive:shared
      # Add more mount points as needed
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - PYTHONPATH=/app
      - GDRIVE_MOUNT_ENABLED=true
      - GDRIVE_MOUNT_PATH=/mnt/gdrive
      - GDRIVE_RCLONE_REMOTE=gdrive
      - GDRIVE_VFS_CACHE_MODE=writes
      - GDRIVE_VFS_CACHE_MAX_SIZE=1G
      - GDRIVE_VFS_READ_CHUNK_SIZE=128M
      - GDRIVE_DIR_CACHE_TIME=5m
      - GDRIVE_POLL_INTERVAL=15s

volumes:
  gdrive_mount:
    driver: local
